; Forest Fire IoT - Gateway (LilyGO T-Beam Supreme, ESP32-S3 + SX1262, 915.2 MHz)
; Settings: firmware/site_config.h (shared with the nodes) and firmware/gateway_aws.h (generated by Terraform).
; pio run -t upload && pio device monitor
;
; Board: generic ESP32-S3 profile set to the T-Beam Supreme's 8 MB flash and 8 MB QSPI PSRAM.
; The LoRa radio settings also come from firmware/site_config.h, so they always match the nodes.

[env:t_beam_supreme_sx1262]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
monitor_filters = time, default, esp32_exception_decoder
build_flags =
    -I${PROJECT_DIR}/..
    -DT_BEAM_S3_SUPREME_SX1262
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib@7.6.0
    lewisxhe/XPowersLib@0.2.6
    olikraus/U8g2@^2.34.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
