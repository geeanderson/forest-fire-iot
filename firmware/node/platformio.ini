; Forest Fire IoT - Sensor Node (Heltec WiFi LoRa 32 V4, ESP32-S3 + SX1262)
; Settings: firmware/site_config.h (shared with the gateway; copy it from site_config.h.example).
; pio run -t upload --upload-port /dev/cu.usbmodemXXXX
;
; `board` uses the generic ESP32-S3 devkit profile - if PlatformIO's
; espressif32 platform on your machine ships an official
; "heltec_wifi_lora_32_V4" board id, switch to that instead for correct
; default flash/PSRAM size and USB-CDC settings out of the box (V4 is a
; 2025 release, may not be registered yet depending on platform version).

[env:heltec_v4]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/..
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    jgromes/RadioLib @ ^7.1.2
    bblanchon/ArduinoJson @ ^7.2.0
